<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Dashboard — State Migration &amp; Cost of Living</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Phase 2 structure checkpoint: no design yet (Phase 3), no KPI/panel
       content yet (Phase 5). This proves data.js + state.js (filters + URL
       sync) work end-to-end through the new module structure. -->
  <nav>
    <div class="wrap">
      <a href="index.html">State Migration &amp; Cost of Living</a>
      <a href="dashboard.html">Dashboard</a>
    </div>
  </nav>

  <main class="wrap">
    <h1>Dashboard</h1>
    <p id="selection-count">Loading…</p>

    <section aria-label="Filters">
      <label>Year <select id="filter-year"></select></label>
      <label>Destination state <select id="filter-current-state"></select></label>
      <label>Origin state <select id="filter-prior-state"></select></label>
      <label>Region <select id="filter-region"></select></label>
      <button id="reset-filters" type="button">Reset filters</button>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/6.1.0/echarts.min.js"></script>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
